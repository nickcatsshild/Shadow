<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Shadow Core">
  <title>Shadow Core — Powering next-gen innovation</title>
  <defs>
    <!-- Fundo grafite com sutil profundidade radial -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#141922"/>
      <stop offset="50%"  stop-color="#0b0f16"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <radialGradient id="halo" cx="30%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#22b8f0" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#22b8f0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22b8f0" stop-opacity="0"/>
    </radialGradient>

    <!-- Escudo interno do logo (versão compacta pro banner) -->
    <linearGradient id="shieldBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e252f"/>
      <stop offset="100%" stop-color="#0b0f15"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7fdcff"/>
      <stop offset="100%" stop-color="#0e8ec4"/>
    </linearGradient>
    <linearGradient id="sBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#e6ecf1"/>
      <stop offset="100%" stop-color="#a8b0b8"/>
    </linearGradient>
    <radialGradient id="sGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22b8f0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22b8f0" stop-opacity="0"/>
    </radialGradient>

    <!-- Texto SHADOW com brilho metálico -->
    <linearGradient id="textFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#d8dee5"/>
      <stop offset="100%" stop-color="#9ea6ae"/>
    </linearGradient>

    <!-- Divisor cyan sutil -->
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22b8f0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#22b8f0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22b8f0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#halo)"/>

  <!-- linhas de circuito decorativas (canto direito, sutis) -->
  <g stroke="#22b8f0" stroke-opacity="0.18" fill="none" stroke-width="1.5">
    <path d="M 900 80 L 1200 80 L 1200 200"/>
    <path d="M 950 560 L 1220 560 L 1220 440"/>
    <circle cx="1200" cy="200" r="4" fill="#22b8f0" fill-opacity="0.6"/>
    <circle cx="1220" cy="440" r="4" fill="#22b8f0" fill-opacity="0.6"/>
    <path d="M 1050 320 L 1240 320" stroke-dasharray="4 6"/>
  </g>

  <!-- ===== ESCUDO + S (esquerda) ===== -->
  <g transform="translate(110, 165)">
    <!-- Escudo 310x310 -->
    <rect x="0" y="0" width="310" height="310" rx="70" ry="70" fill="url(#shieldBg)"/>
    <rect x="0" y="0" width="310" height="310" rx="70" ry="70"
          fill="none" stroke="url(#shieldEdge)" stroke-width="4"/>
    <ellipse cx="155" cy="155" rx="115" ry="115" fill="url(#sGlow)"/>

    <!-- S geométrico bold, mesmo path do logo principal em escala 0.605 -->
    <g transform="translate(155, 155) scale(0.605) translate(-256, -256)">
      <path d="
        M 356 168
        C 356 132, 322 106, 268 106
        L 232 106
        C 178 106, 148 138, 148 184
        C 148 226, 178 246, 224 254
        L 288 266
        C 322 272, 344 288, 344 320
        C 344 358, 314 386, 260 386
        C 210 386, 172 366, 156 328"
        fill="none"
        stroke="url(#sBody)"
        stroke-width="66"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ===== TEXTO (direita) ===== -->
  <g transform="translate(500, 0)">
    <!-- SHADOW -->
    <text x="0" y="290"
          font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="140"
          font-weight="800"
          letter-spacing="8"
          fill="url(#textFill)">SHADOW</text>

    <!-- Divisor cyan -->
    <rect x="6" y="315" width="640" height="2" fill="url(#divider)"/>

    <!-- CORE -->
    <text x="6" y="365"
          font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="34"
          font-weight="600"
          letter-spacing="18"
          fill="#7fdcff"
          fill-opacity="0.85">CORE</text>

    <!-- Tagline -->
    <text x="6" y="425"
          font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="26"
          font-weight="400"
          fill="#a8b0b8">Powering next-gen innovation</text>

    <!-- Features chips discretas -->
    <g transform="translate(6, 470)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500">
      <g>
        <rect x="0" y="0" width="140" height="34" rx="17" fill="#1a2028" stroke="#22b8f0" stroke-opacity="0.35" stroke-width="1"/>
        <text x="70" y="22" fill="#c8ced5" text-anchor="middle">Portable</text>
      </g>
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="140" height="34" rx="17" fill="#1a2028" stroke="#22b8f0" stroke-opacity="0.35" stroke-width="1"/>
        <text x="70" y="22" fill="#c8ced5" text-anchor="middle">Local LLM</text>
      </g>
      <g transform="translate(300, 0)">
        <rect x="0" y="0" width="140" height="34" rx="17" fill="#1a2028" stroke="#22b8f0" stroke-opacity="0.35" stroke-width="1"/>
        <text x="70" y="22" fill="#c8ced5" text-anchor="middle">Cloud AI</text>
      </g>
      <g transform="translate(450, 0)">
        <rect x="0" y="0" width="180" height="34" rx="17" fill="#1a2028" stroke="#22b8f0" stroke-opacity="0.35" stroke-width="1"/>
        <text x="90" y="22" fill="#c8ced5" text-anchor="middle">Auto-Learning</text>
      </g>
    </g>
  </g>
</svg>
